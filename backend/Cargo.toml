[package]
name = "arm112"
version = "0.1.0"
edition = "2021"
# Утилиты импорта живут рядом, поэтому основной бинарник указан явно
default-run = "arm112"
description = "Тренажёр оператора ДДС: серверная часть"

[dependencies]
# HTTP
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip"] }
tokio = { version = "1", features = ["full"] }

# База. Без compile-time макросов: схема на хакатоне меняется часто,
# живая база при сборке будет мешать, а не помогать.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate",
] }

# Сериализация
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Прочее
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
async-trait = "0.1"
calamine = "0.36.1"
# rust_crypto, а не aws_lc_rs: чистый Rust собирается под mingw без
# сишного тулчейна — от этого зависит кросс-сборка .exe под Windows
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
argon2 = "0.6.0"
password-hash = { version = "0.6.1", features = ["getrandom", "rand_core"] }
rand = "0.10.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# oneshot по роутеру: тесты API без поднятого сервера и свободного порта
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
